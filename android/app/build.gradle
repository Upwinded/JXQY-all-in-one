def findAndroidAssetEntries = { File assetsDirectory, List<String> patterns ->
    def scanner = new DirectoryScanner()
    scanner.setBasedir(assetsDirectory)
    scanner.setIncludes(patterns as String[])
    scanner.scan()
    [
        files: scanner.includedFiles.collect { relativePath ->
            new File(assetsDirectory, relativePath)
        },
        directories: scanner.includedDirectories.collect { relativePath ->
            new File(assetsDirectory, relativePath)
        }
    ]
}

def keepOnlyReleaseBootstrapAssets = { File assetsDirectory ->
    if (!assetsDirectory.isDirectory()) {
        throw new GradleException(
            "Android merged asset directory is missing: ${assetsDirectory}")
    }
    assetsDirectory.listFiles().each { entry ->
        if (entry.name != 'engine' && entry.name != 'resources.ini') {
            project.delete(entry)
            if (entry.exists()) {
                throw new GradleException(
                    "Failed to remove non-bootstrap Android asset: ${entry}")
            }
        }
    }
    def unexpectedFiles = fileTree(assetsDirectory).files.findAll { file ->
        def relativePath = assetsDirectory.toPath()
            .relativize(file.toPath()).toString().replace('\\', '/')
        relativePath != 'resources.ini' &&
            !relativePath.startsWith('engine/')
    }
    if (!unexpectedFiles.isEmpty()) {
        throw new GradleException(
            "Android release contains non-bootstrap assets: " +
            "${unexpectedFiles.collect { it.absolutePath }.sort().take(10)}")
    }
}

android {
    namespace = "org.libsdl.app"
    compileSdk 36
    buildFeatures {
        prefab = true
    }
    androidResources {
        noCompress += ['mp4', 'wmv', 'avi', 'mpg', 'mpeg']
    }
    defaultConfig {
        resValue "string", "app_name", displayName
        applicationId = applicationIdentifier;
        minSdkVersion 28
        targetSdk 36
        versionCode appVersionCode
        versionName "${appVersion}"
        externalNativeBuild {
            ndkBuild {
                cppFlags '-std=c++17'
                arguments "APP_PLATFORM=android-21"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a', 'x86_64'
            }
            cmake {
                cppFlags '-std=c++17'
                //arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static", "-DAPP_SUPPORT_FLEXIBLE_PAGE_SIZES=true"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    sourceSets {
        debug {
            assets {
                srcDirs = ['../../assets']
                androidAssetExcludes.each { pattern ->
                    exclude pattern
                }
            }
        }
        release {
            assets {
                srcDirs = ['../../assets']
            }
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            // 注意：minifyEnabled false 时 R8 不运行，此 proguard 配置实际不生效。
            // 这里使用 proguard-android-optimize.txt 仅为了满足新版 AGP 的评估要求
            // （旧 proguard-android.txt 因含 -dontoptimize 已被 AGP 拒绝）。
            // 若将来要真正启用代码优化/混淆，需将 minifyEnabled 改为 true，
            // 并在 proguard-rules.pro 中补齐 keep 规则。
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            if (buildWithCMake) {
                cmake {
                    path 'jni/CMakeLists.txt'
                }
            } else {
                ndkBuild {
                    path 'jni/Android.mk'
                }
            }
        }

    }
    tasks.register("copySdlAars", Copy) {
        from fileTree("../../ThirdParty/devel/android/SDL")
        into "libs"
        include "*.aar"
        doFirst {
            delete fileTree("libs") {
                include "SDL3*.aar"
            }
        }
    }

    preBuild.dependsOn(tasks.named("copySdlAars"))
    tasks.matching { it.name.startsWith("externalNativeBuildClean") }.configureEach {
        dependsOn(tasks.named("copySdlAars"))
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantTaskSuffix =
            variant.name.substring(0, 1).toUpperCase(Locale.ROOT) +
            variant.name.substring(1)
        def isReleaseVariant = variant.buildType == 'release'
        def variantAssetExcludes = androidAssetExcludes.toList()

        def mergedAssetsDirectoryProvider =
            variant.artifacts.get(SingleArtifact.ASSETS.INSTANCE)
        tasks.matching {
            it.name == "merge${variantTaskSuffix}Assets"
        }.configureEach {
            if (isReleaseVariant) {
                doLast {
                    keepOnlyReleaseBootstrapAssets(
                        mergedAssetsDirectoryProvider.get().asFile)
                }
            } else {
                doLast {
                    def mergedAssetsDirectory =
                        mergedAssetsDirectoryProvider.get().asFile
                    def excludedAssetEntries = findAndroidAssetEntries(
                        mergedAssetsDirectory,
                        variantAssetExcludes)
                    excludedAssetEntries.files.each { excludedFile ->
                        if (!excludedFile.delete() && excludedFile.exists()) {
                            throw new GradleException(
                                "Failed to remove excluded Android asset: ${excludedFile}")
                        }
                    }
                    excludedAssetEntries.directories
                        .sort { left, right ->
                            right.absolutePath.length() <=> left.absolutePath.length()
                        }
                        .each { excludedDirectory ->
                            if (!excludedDirectory.delete() && excludedDirectory.exists()) {
                                throw new GradleException(
                                    "Failed to remove excluded Android asset directory: " +
                                    "${excludedDirectory}")
                            }
                        }

                    def remainingExcludedEntries = findAndroidAssetEntries(
                        mergedAssetsDirectory,
                        variantAssetExcludes)
                    def remainingExcludedPaths =
                        remainingExcludedEntries.files +
                        remainingExcludedEntries.directories
                    if (!remainingExcludedPaths.isEmpty()) {
                        def samples = remainingExcludedPaths
                            .collect { it.absolutePath }
                            .sort()
                            .take(10)
                        throw new GradleException(
                            "Android merged assets still contain excluded files: ${samples}")
                    }
                }
            }
        }

        def outputAPKName = "${artifactName}_${variant.name}_v${appVersion}.apk";
        def copyApkTask = tasks.register(
            "copy${variantTaskSuffix}ApkToDistribution", Copy) {
            from(variant.artifacts.get(SingleArtifact.APK.INSTANCE)) {
                include '*.apk'
                rename { outputAPKName }
            }
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
            into rootProject.file('../bin/android')
        }
        tasks.matching {
            it.name == "assemble${variantTaskSuffix}"
        }.configureEach {
            dependsOn(copyApkTask)
        }
    }
}


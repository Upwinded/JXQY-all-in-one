def buildWithCMake = true; //project.hasProperty('BUILD_WITH_CMAKE');
def artifactName = "jxqy-all-in-one";
def displayName = "剑侠情缘 All-in-One";
def applicationIdentifier = "com.upwinded.jxqy_all_in_one";
def appVersionFile = file("../../cmake/JxqyEngineVersion.inc")
def appVersionMatch = appVersionFile.getText("UTF-8").trim() =~
    /^"([0-9]+\.[0-9]+\.[0-9]+)"$/
if (!appVersionMatch.matches()) {
    throw new GradleException(
        'cmake/JxqyEngineVersion.inc must contain one quoted major.minor.patch version')
}
def appVersion = appVersionMatch.group(1)
def appVersionParts = appVersion.tokenize('.').collect {
    Integer.parseInt(it)
}
if (appVersionParts.size() != 3 ||
    appVersionParts[0] < 0 || appVersionParts[0] > 2100 ||
    appVersionParts[1] < 0 || appVersionParts[1] > 999 ||
    appVersionParts[2] < 0 || appVersionParts[2] > 999) {
    throw new GradleException(
        'appVersion must be major.minor.patch with major <= 2100 and ' +
        'minor/patch <= 999')
}
// Android requires an integer versionCode. Derive it from the public semantic
// version instead of maintaining or publishing a separate build counter.
def appVersionCode = appVersionParts[0] * 1_000_000 +
    appVersionParts[1] * 1_000 + appVersionParts[2]
if (appVersionCode > 2_100_000_000) {
    throw new GradleException(
        'appVersion produces an Android versionCode above 2100000000')
}

def readReleaseSigningValue = { String propertyName, String environmentName ->
    def propertyValue = providers.gradleProperty(propertyName).orNull
    propertyValue != null ? propertyValue : System.getenv(environmentName)
}
def releaseStoreFilePath = readReleaseSigningValue(
    'jxqyReleaseStoreFile', 'JXQY_ANDROID_KEYSTORE')
def releaseStorePassword = readReleaseSigningValue(
    'jxqyReleaseStorePassword', 'JXQY_ANDROID_STORE_PASSWORD')
def releaseKeyAlias = readReleaseSigningValue(
    'jxqyReleaseKeyAlias', 'JXQY_ANDROID_KEY_ALIAS')
def releaseKeyPassword = readReleaseSigningValue(
    'jxqyReleaseKeyPassword', 'JXQY_ANDROID_KEY_PASSWORD')
def releaseSigningValues = [
    releaseStoreFilePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
]
def releaseSigningConfigured = releaseSigningValues.every {
    it != null && !it.isEmpty()
}
if (releaseSigningValues.any { it != null && !it.isEmpty() } &&
    !releaseSigningConfigured) {
    throw new GradleException(
        'Android release signing configuration is incomplete. Configure all ' +
        'four jxqyRelease* Gradle properties or JXQY_ANDROID_* environment variables.')
}

